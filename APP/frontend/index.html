    <script>
      // Applies the theme before first paint, so the app never flashes the
      // wrong colors — the same thing next-themes does server-side on
      // illinoisjobtracker.com. Without this a client-rendered SPA can only
      // set the class after hydration, which is exactly the seam we're closing.
      //
      // Also consumes the ?theme= handoff from .com: the two domains are
      // separate origins and cannot share localStorage, so an explicit choice
      // made on the marketing site travels in the URL.
      //
      // Storage key must match THEME_STORAGE_KEY in src/lib/site.js.
      (function () {
        try {
          var KEY = "ijt-theme";
          var url = new URL(window.location.href);
          var handoff = url.searchParams.get("theme");
          if (handoff === "light" || handoff === "dark") {
            localStorage.setItem(KEY, handoff);
            url.searchParams.delete("theme");
            history.replaceState({}, "", url.pathname + url.search + url.hash);
          }
          var stored = localStorage.getItem(KEY);
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private-mode storage or a malformed URL: fall through to system */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
