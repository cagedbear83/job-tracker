# Local full-stack backend + MongoDB.
#   docker compose up --build
# The React frontend is run separately (yarn start) or deployed to Vercel.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./APP/backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - mongo
    environment:
      # --- Required ---
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-ides_tracker_db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # --- Dev helpers ---
      ENABLE_DEMO_USER: ${ENABLE_DEMO_USER:-true}
      # --- Production hardening (all optional) ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      # --- Integrations (optional) ---
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  mongo_data:
