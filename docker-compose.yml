# Local full-stack backend + MongoDB.
#   docker compose up --build
# The React frontend is run separately (yarn start) or deployed to Vercel.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Loopback only: this Mongo has no auth, so never expose it to the LAN.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./APP/backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - mongo
    environment:
      # --- Required ---
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-ides_tracker_db}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Clerk development instance. No defaults on purpose: the backend
      # refuses to start without these. Put them in a .env next to this file.
      CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER in .env (https://<slug>.clerk.accounts.dev)}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env (sk_test_...)}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Turns off the production-only checks (explicit CORS, required azp,
      # HSTS) so '*' and an empty CLERK_AUTHORIZED_PARTIES work locally.
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # --- Production hardening (all optional) ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      # --- Integrations (optional) ---
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      CLICKSEND_USERNAME: ${CLICKSEND_USERNAME:-}
      CLICKSEND_API_KEY: ${CLICKSEND_API_KEY:-}
      CLICKSEND_FROM_NUMBER: ${CLICKSEND_FROM_NUMBER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  mongo_data:
