# Render Blueprint for the backend API (Docker).
# Frontend deploys separately to Vercel (see APP/frontend/vercel.json).
#
# Secrets (sync: false / values left blank) are set in the Render dashboard;
# they are never committed. Bring your own MongoDB (e.g. MongoDB Atlas) and
# put its connection string in MONGO_URL.
services:
  - type: web
    name: ides-job-tracker-api
    runtime: docker
    dockerfilePath: ./APP/backend/Dockerfile
    dockerContext: ./APP/backend
    plan: starter
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      # --- Required ---
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: ides_tracker_db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # --- Production defaults ---
      - key: ENABLE_DEMO_USER
        value: "false"
      - key: ENABLE_HSTS
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      # --- Error tracking (optional) ---
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # --- Integrations (optional) ---
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
